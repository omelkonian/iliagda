name: CI
on:
  push: {branches: main}
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: omelkonian/setup-agda@main
        with:
          agda-version: 2.8.0
          stdlib-version: 2.3
          libraries: |
             omelkonian/agda-stdlib-classes#v2.3
             omelkonian/agda-stdlib-meta#v2.3
          main: Iliagda
      - run: ghc --make Site/Main.hs -o site -i. && ./site
      - run: agda --html --html-dir=docs/agda Iliagda.agda
      - run: touch docs/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
